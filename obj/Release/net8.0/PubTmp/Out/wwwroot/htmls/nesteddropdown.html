<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Enterprise Tree Dropdown</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/jstree@3.3.17/dist/themes/default/style.min.css">

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
    border-radius:15px;
}

.dropdown-tree{
    display:none;
    position:absolute;
    width:100%;
    background:white;
    border-radius:10px;
    border:1px solid #ddd;
    z-index:1000;
    max-height:350px;
    overflow:auto;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.selected-path{
    font-size:.9rem;
    color:#0d6efd;
    margin-top:10px;
    font-weight:600;
}

</style>

</head>
<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h4>Select Department</h4>

</div>

<div class="card-body position-relative">

<label class="form-label fw-bold">

Department Hierarchy

</label>

<input
type="text"
id="selectedValue"
class="form-control"
placeholder="Click here..."
readonly>

<input
type="hidden"
id="selectedId">

<div id="treeContainer" class="dropdown-tree">

<div id="tree"></div>

</div>

<div class="selected-path" id="path"></div>

<hr>

<button class="btn btn-success w-100"
onclick="submitSelection()">

Submit

</button>

<div
id="result"
class="alert alert-success mt-3 d-none">
</div>

</div>

</div>

</div>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jstree@3.3.17/dist/jstree.min.js"></script>

<script>

$("#tree").jstree({

core:{
data:[

{
text:"Engineering",
state:{opened:true},
children:[

{
text:"Electrical",
children:[

{text:"Electric"},

{text:"Voltage"},

{text:"Ampere"},

{text:"Watt"},

{text:"Current"}

]
},

{
text:"Mechanical",
children:[

{text:"Engine"},

{text:"Gear"},

{text:"Bearing"}

]
}

]
},

{
text:"IT",
children:[

{
text:"Software",
children:[

{text:"ASP.NET"},

{text:"Java"},

{text:"Python"}

]
},

{
text:"Network",
children:[

{text:"Cisco"},

{text:"Firewall"},

{text:"VPN"}

]
}

]
}

]

}

});

const input=document.getElementById("selectedValue");
const treeBox=document.getElementById("treeContainer");

input.onclick=()=>{

treeBox.style.display="block";

};

document.addEventListener("click",function(e){

if(!treeBox.contains(e.target)&&e.target!==input){

treeBox.style.display="none";

}

});

$('#tree').on("select_node.jstree",function(e,data){

if(data.node.children.length===0){

let path=$("#tree").jstree(true)
.get_path(data.node,' > ');

input.value=data.node.text;

document.getElementById("selectedId").value=data.node.id;

document.getElementById("path").innerHTML=

"Selected : <b>"+path+"</b>";

treeBox.style.display="none";

}

});

function submitSelection(){

let value=input.value;

let path=document.getElementById("path").innerText;

if(value===""){

alert("Please select an item.");

return;

}

let result=document.getElementById("result");

result.classList.remove("d-none");

result.innerHTML=

"<h5>Registration Data</h5>" +

"<b>Selected Item:</b> "+value+

"<br>"+path;

}

</script>

</body>
</html>
